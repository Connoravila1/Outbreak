<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OUTBREAK — Boot Screen Mock</title>
<style>
  :root{
    --blood:#e30613;
    --blood-deep:#a30410;
    --blood-glow:#ff2436;
    --char:#171514;
    --char-2:#0d0c0b;
    --ash:#3a3532;
    --bone:#cbc4bd;
    --amber:#f0a020;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:#08080a;
    font-family:"Courier New",ui-monospace,monospace;
    color:var(--bone);
    display:flex;flex-direction:column;align-items:center;
    min-height:100vh;padding:28px 16px;gap:22px;
    -webkit-font-smoothing:antialiased;
  }
  .lab{
    text-transform:uppercase;letter-spacing:.42em;font-size:11px;
    color:#6a625d;font-weight:700;
  }
  /* -------- phone frame -------- */
  .phone{
    position:relative;width:340px;height:718px;border-radius:44px;
    background:#000;padding:11px;
    box-shadow:0 0 0 2px #201d1b,0 30px 80px rgba(0,0,0,.7),0 0 60px rgba(227,6,19,.06);
  }
  .notch{
    position:absolute;top:11px;left:50%;transform:translateX(-50%);
    width:130px;height:26px;background:#000;border-radius:0 0 18px 18px;z-index:40;
  }
  .screen{
    position:relative;width:100%;height:100%;border-radius:34px;overflow:hidden;
    background:var(--char-2);
  }
  /* scorched spore field, top + bottom bands, generated with radial gradients */
  .field{
    position:absolute;inset:0;z-index:1;pointer-events:none;
    background:var(--char-2);
  }
  .spores{
    position:absolute;left:0;right:0;height:34%;pointer-events:none;
    background:
      radial-gradient(1.5px 1.5px at 10% 20%, var(--blood) 40%, transparent 42%),
      radial-gradient(2px 2px at 22% 55%, var(--blood-deep) 40%, transparent 42%),
      radial-gradient(1px 1px at 33% 12%, var(--blood-glow) 40%, transparent 42%),
      radial-gradient(2.5px 2.5px at 46% 70%, var(--blood) 40%, transparent 42%),
      radial-gradient(1.5px 1.5px at 58% 30%, var(--blood-deep) 40%, transparent 42%),
      radial-gradient(1px 1px at 67% 60%, var(--blood-glow) 40%, transparent 42%),
      radial-gradient(2px 2px at 78% 18%, var(--blood) 40%, transparent 42%),
      radial-gradient(1.5px 1.5px at 88% 48%, var(--blood-deep) 40%, transparent 42%),
      radial-gradient(2px 2px at 15% 80%, var(--blood) 40%, transparent 42%),
      radial-gradient(1px 1px at 40% 90%, var(--blood-glow) 40%, transparent 42%),
      radial-gradient(2px 2px at 72% 85%, var(--blood-deep) 40%, transparent 42%),
      radial-gradient(1.5px 1.5px at 92% 78%, var(--blood) 40%, transparent 42%),
      radial-gradient(3px 3px at 28% 40%, var(--blood-deep) 35%, transparent 38%),
      radial-gradient(2px 2px at 52% 50%, var(--blood) 38%, transparent 40%),
      radial-gradient(60% 40% at 30% 30%, rgba(227,6,19,.10), transparent 70%),
      radial-gradient(50% 50% at 75% 60%, rgba(227,6,19,.08), transparent 70%);
    filter:contrast(1.1);
  }
  .spores.top{top:0}
  .spores.bottom{bottom:0;transform:scaleY(-1)}

  /* -------- wordmark -------- */
  .mark{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:20;
    font-family:"Arial Black","Arial Narrow",Impact,sans-serif;
    font-weight:900;font-size:52px;letter-spacing:.02em;
    color:var(--blood);line-height:1;
    text-shadow:0 0 22px rgba(227,6,19,.45);
    -webkit-text-stroke:1px rgba(0,0,0,.35);
    white-space:nowrap;
  }
  .mark::after{ /* stencil breaks */
    content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(90deg,transparent 0 14px,var(--char-2) 14px 16px);
    mix-blend-mode:normal;opacity:.55;
  }
  .tagline{
    position:absolute;top:calc(50% + 44px);left:50%;transform:translateX(-50%);z-index:20;
    font-size:9px;letter-spacing:.55em;color:#7a726c;text-transform:uppercase;font-weight:700;
    white-space:nowrap;
  }

  /* -------- terminal phase -------- */
  .terminal{
    position:absolute;inset:0;z-index:30;padding:64px 26px;
    background:var(--char-2);
    font-size:12px;line-height:1.9;color:#8a8078;
    display:none;
  }
  .terminal .line{white-space:nowrap;overflow:hidden}
  .terminal .ok{color:var(--blood)}
  .terminal .warn{color:var(--amber)}
  .cursor{display:inline-block;width:8px;height:14px;background:var(--blood);
    vertical-align:-2px;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  /* -------- progress (infection bar) -------- */
  .progress-wrap{
    position:absolute;left:38px;right:38px;bottom:74px;z-index:25;display:none;
  }
  .progress-label{
    display:flex;justify-content:space-between;font-size:9px;letter-spacing:.3em;
    text-transform:uppercase;color:#6a625d;margin-bottom:8px;
  }
  .progress-track{height:3px;background:#241f1d;overflow:hidden}
  .progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--blood-deep),var(--blood-glow));
    box-shadow:0 0 12px var(--blood-glow)}

  .tap{
    position:absolute;left:0;right:0;bottom:52px;z-index:25;text-align:center;
    font-size:10px;letter-spacing:.4em;text-transform:uppercase;color:#8a8078;
    display:none;animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}

  /* infection wipe overlay that "grows" inward */
  .wipe{position:absolute;inset:0;z-index:15;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 50%, transparent 0, transparent var(--r,0%), var(--char-2) calc(var(--r,0%) + 2%));
  }

  /* glitch */
  .glitching .mark{animation:glitch .38s steps(2) 1}
  @keyframes glitch{
    0%{transform:translate(-50%,-50%);clip-path:inset(0)}
    20%{transform:translate(-52%,-50%);text-shadow:2px 0 var(--blood-glow),-2px 0 #24a0ff;clip-path:inset(20% 0 40% 0)}
    40%{transform:translate(-48%,-51%);text-shadow:-3px 0 var(--blood-glow),3px 0 #24a0ff;clip-path:inset(60% 0 10% 0)}
    60%{transform:translate(-51%,-49%);text-shadow:2px 0 var(--blood-glow),-2px 0 #24a0ff;clip-path:inset(10% 0 70% 0)}
    100%{transform:translate(-50%,-50%);text-shadow:0 0 22px rgba(227,6,19,.45);clip-path:inset(0)}
  }

  .scanlines{position:absolute;inset:0;z-index:35;pointer-events:none;opacity:.06;
    background:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 3px)}

  /* hidden-by-default helpers */
  .hide{display:none!important}
  .fade-in{animation:fadein .5s ease both}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  .mark.build .letter{opacity:0;animation:burn .5s ease forwards}
  @keyframes burn{
    from{opacity:0;filter:blur(6px);text-shadow:0 0 30px var(--blood-glow)}
    to{opacity:1;filter:blur(0);text-shadow:0 0 22px rgba(227,6,19,.45)}
  }

  /* -------- controls -------- */
  .controls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:360px}
  button{
    font-family:inherit;font-size:11px;letter-spacing:.15em;text-transform:uppercase;
    color:var(--bone);background:#171514;border:1px solid #2e2926;padding:11px 14px;
    cursor:pointer;transition:.15s;font-weight:700;
  }
  button:hover{border-color:var(--blood);color:#fff;box-shadow:0 0 14px rgba(227,6,19,.25)}
  button:focus-visible{outline:2px solid var(--blood);outline-offset:2px}
  .note{max-width:340px;text-align:center;font-size:11px;line-height:1.7;color:#6a625d}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* --- app embed: fill the screen, drop the demo chrome --- */
.lab,.controls,.note,.notch{display:none!important}
html,body{background:#08080a}
body{padding:0!important;gap:0!important;min-height:100vh;justify-content:center}
.phone{width:100vw!important;height:100vh!important;border-radius:0!important;padding:0!important;box-shadow:none!important;background:#08080a}
.screen{border-radius:0!important}
.tap{bottom:calc(env(safe-area-inset-bottom) + 54px)}
.progress-wrap{bottom:calc(env(safe-area-inset-bottom) + 92px)}
</style>
</head>
<body>
  <div class="lab">Outbreak · boot sequence mock</div>

  <div class="phone">
    <div class="notch"></div>
    <div class="screen" id="screen">
      <div class="field">
        <div class="spores top"></div>
        <div class="spores bottom"></div>
      </div>

      <!-- terminal boot -->
      <div class="terminal" id="terminal"></div>

      <!-- wordmark -->
      <div class="mark" id="mark">OUTBREAK</div>
      <div class="tagline" id="tagline">Humanity's last stand</div>

      <!-- infection wipe -->
      <div class="wipe" id="wipe" style="--r:150%"></div>

      <!-- progress -->
      <div class="progress-wrap" id="progressWrap">
        <div class="progress-label"><span>Containment failing</span><span id="pct">0%</span></div>
        <div class="progress-track"><div class="progress-fill" id="fill"></div></div>
      </div>

      <div class="tap" id="tap">Tap to enter</div>
      <div class="scanlines"></div>
    </div>
  </div>

  <div class="controls">
    <button onclick="playFull()">▶ Full sequence</button>
    <button onclick="playTerminal()">Terminal boot</button>
    <button onclick="playInfection()">Infection spread</button>
    <button onclick="playGlitch()">Glitch-in (warm start)</button>
    <button onclick="reset()">Reset</button>
  </div>
  <div class="note">The full sequence chains terminal → infection spread → glitch-in → ready. "Glitch-in" alone is the fast path for returning players on a warm cache — roughly a 0.4s open, no load screen.</div>

<script>
  const scr=document.getElementById('screen');
  const term=document.getElementById('terminal');
  const mark=document.getElementById('mark');
  const tagline=document.getElementById('tagline');
  const wipe=document.getElementById('wipe');
  const pwrap=document.getElementById('progressWrap');
  const fill=document.getElementById('fill');
  const pct=document.getElementById('pct');
  const tap=document.getElementById('tap');

  let timers=[];
  const wait=ms=>new Promise(r=>{const t=setTimeout(r,ms);timers.push(t);});

  function reset(){
    timers.forEach(clearTimeout);timers=[];
    term.style.display='none';term.innerHTML='';
    mark.style.opacity=0;mark.className='mark';mark.textContent='OUTBREAK';
    tagline.style.opacity=0;
    wipe.style.setProperty('--r','150%');
    pwrap.style.display='none';fill.style.width='0';pct.textContent='0%';
    tap.style.display='none';
    scr.classList.remove('glitching');
  }

  const bootLines=[
    ['SECTOR SCAN . . . . . . . . . . .','ok'],
    ['QUARANTINE PROTOCOL','ok'],
    ['SIGNAL LOCK ACQUIRED','ok'],
    ['CONTAMINATION DETECTED','warn'],
    ['ESTABLISHING PERIMETER','ok'],
  ];

  async function playTerminal(){
    reset();
    term.style.display='block';
    for(const [txt,cls] of bootLines){
      const l=document.createElement('div');
      l.className='line';
      l.innerHTML=`<span>&gt; ${txt}</span> <span class="${cls==='ok'?'ok':'warn'}">[ ${cls==='ok'?'OK':'!!'} ]</span>`;
      l.style.opacity=0;term.appendChild(l);
      await wait(60);l.style.transition='opacity .2s';l.style.opacity=1;
      await wait(300);
    }
    const c=document.createElement('div');
    c.className='line';c.innerHTML='&gt; <span class="cursor"></span>';
    term.appendChild(c);
    await wait(500);
  }

  async function playInfection(){
    reset();
    pwrap.style.display='block';
    // grow the field inward while the bar fills
    let p=0;
    while(p<=100){
      fill.style.width=p+'%';pct.textContent=p+'%';
      wipe.style.setProperty('--r',(150-(p*1.35))+'%');
      if(p>60 && mark.style.opacity<1){buildMark();}
      await wait(24);p+=2;
    }
    await wait(200);
    tagline.style.opacity=1;tagline.className='fade-in';
    pwrap.style.display='none';
  }

  function buildMark(){
    mark.style.opacity=1;
    mark.className='mark build';
    const word='OUTBREAK';
    mark.textContent='';
    [...word].forEach((ch,i)=>{
      const s=document.createElement('span');
      s.className='letter';s.textContent=ch;
      s.style.animationDelay=(i*0.05)+'s';
      mark.appendChild(s);
    });
  }

  async function playGlitch(){
    reset();
    mark.style.opacity=1;
    scr.classList.add('glitching');
    await wait(120);
    mark.classList.add('glitching');
    await wait(400);
    scr.classList.remove('glitching');
    tagline.style.opacity=1;tagline.className='fade-in';
    await wait(300);
    tap.style.display='block';
  }

  async function playFull(){
    await playTerminal();
    await playInfection();
    await playGlitch();
  }

  function bootDone(){ if(window.__bd)return; window.__bd=1; try{parent.postMessage('boot-done','*');}catch(e){} }
  document.getElementById('screen').addEventListener('pointerup',()=>{ if(tap.style.display==='block') bootDone(); });
  playFull().then(()=>{ const t=setTimeout(bootDone,7000); document.getElementById('screen').addEventListener('pointerup',()=>clearTimeout(t),{once:true}); });
</script>
</body>
</html>
